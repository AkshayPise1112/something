version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tg-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tgotg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/extensions.sql:/docker-entrypoint-initdb.d/01_extensions.sql
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/02_schema.sql
      - ./database/seeds/001_demo_seed.sql:/docker-entrypoint-initdb.d/03_seeds.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tgotg"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tg-backend
    restart: always
    environment:
      APP_ENV: production
      PORT: 4000
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tgotg
      DATA_MODE: demo
      INTELLIGENCE_MODE: mock
      JWT_SECRET: tg-secret-jwt-key-growth-works-2025
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tg-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
